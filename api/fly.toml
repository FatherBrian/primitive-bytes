# The demo API on Fly.io. Deploy from this folder: fly deploy
# The Anthropic key is a secret, never in this file: fly secrets set ANTHROPIC_API_KEY=...
app = "primitive-bytes-demo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DEMO_ALLOWED_ORIGINS = "https://fatherbrian.github.io"
  DEMO_DB = "/data/runs.db"

# Saved runs live in SQLite on this volume, so they survive deploys.
[mounts]
  source = "runs"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  # One machine that stays up: SQLite wants a single writer, and the daily
  # budget counter lives in memory.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
