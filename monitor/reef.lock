              serves as a timeout for them instead of the default action timeout
            type: number
        type: object
      sha256: sha256:8d351da066a8edfebfca06db6c14acb2fce2e69ce82ab4c1131a92000b00cc8f
  sequential-thinking:
    sequentialthinking:
      annotations:
        destructiveHint: false
        idempotentHint: false
        openWorldHint: false
        readOnlyHint: false
      description: "A detailed tool for dynamic and reflective problem-solving through thoughts.\nThis\
        \ tool helps analyze problems through a flexible thinking process that can adapt and evolve.\n\
        Each thought can build on, question, or revise previous insights as understanding deepens.\n\n\
        When to use this tool:\n- Breaking down complex problems into steps\n- Planning and design with\
        \ room for revision\n- Analysis that might need course correction\n- Problems where the full scope\
        \ might not be clear initially\n- Problems that require a multi-step solution\n- Tasks that need\
        \ to maintain context over multiple steps\n- Situations where irrelevant information needs to\
        \ be filtered out\n\nKey features:\n- You can adjust total_thoughts up or down as you progress\n\
        - You can question or revise previous thoughts\n- You can add more thoughts even after reaching\
        \ what seemed like the end\n- You can express uncertainty and explore alternative approaches\n\
        - Not every thought needs to build linearly - you can branch or backtrack\n- Generates a solution\
        \ hypothesis\n- Verifies the hypothesis based on the Chain of Thought steps\n- Repeats the process\
        \ until satisfied\n- Provides a correct answer\n\nParameters explained:\n- thought: Your current\
        \ thinking step, which can include:\n  * Regular analytical steps\n  * Revisions of previous thoughts\n\
        \  * Questions about previous decisions\n  * Realizations about needing more analysis\n  * Changes\
        \ in approach\n  * Hypothesis generation\n  * Hypothesis verification\n- nextThoughtNeeded: True\
        \ if you need more thinking, even if at what seemed like the end\n- thoughtNumber: Current number\
        \ in sequence (can go beyond initial total if needed)\n- totalThoughts: Current estimate of thoughts\
        \ needed (can be adjusted up/down)\n- isRevision: A boolean indicating if this thought revises\
        \ previous thinking\n- revisesThought: If is_revision is true, which thought number is being reconsidered\n\
        - branchFromThought: If branching, which thought number is the branching point\n- branchId: Identifier\
        \ for the current branch (if any)\n- needsMoreThoughts: If reaching end but realizing more thoughts\
        \ needed\n\nYou should:\n1. Start with an initial estimate of needed thoughts, but be ready to\
        \ adjust\n2. Feel free to question or revise previous thoughts\n3. Don't hesitate to add more\
        \ thoughts if needed, even at the \"end\"\n4. Express uncertainty when present\n5. Mark thoughts\
        \ that revise previous thinking or branch into new paths\n6. Ignore information that is irrelevant\
        \ to the current step\n7. Generate a solution hypothesis when appropriate\n8. Verify the hypothesis\
        \ based on the Chain of Thought steps\n9. Repeat the process until satisfied with the solution\n\
        10. Provide a single, ideally correct answer as the final output\n11. Only set nextThoughtNeeded\
        \ to false when truly done and a satisfactory answer is reached"
      inputSchema:
        $schema: http://json-schema.org/draft-07/schema#
        properties:
          branchFromThought:
            description: Branching point thought number
            maximum: 9007199254740991
            minimum: 1
            type: integer
          branchId:
            description: Branch identifier
            type: string
          isRevision:
            description: Whether this revises previous thinking
            type:
            - boolean
            - string
          needsMoreThoughts:
            description: If more thoughts are needed
            type:
            - boolean
            - string
          nextThoughtNeeded:
            description: Whether another thought step is needed
            type:
            - boolean
            - string
          revisesThought:
            description: Which thought is being reconsidered
            maximum: 9007199254740991
            minimum: 1
            type: integer
          thought:
            description: Your current thinking step
            type: string
          thoughtNumber:
            description: Current thought number (numeric value, e.g., 1, 2, 3)
            maximum: 9007199254740991
            minimum: 1
            type: integer
          totalThoughts:
            description: Estimated total thoughts needed (numeric value, e.g., 5, 10)
            maximum: 9007199254740991
            minimum: 1
            type: integer
        required:
        - thought
        - nextThoughtNeeded
        - thoughtNumber
        - totalThoughts
        type: object
      outputSchema:
        $schema: http://json-schema.org/draft-07/schema#
        additionalProperties: false
        properties:
          branches:
            items:
              type: string
            type: array
          nextThoughtNeeded:
            type: boolean
          thoughtHistoryLength:
            type: number
          thoughtNumber:
            type: number
          totalThoughts:
            type: number
        required:
        - thoughtNumber
        - totalThoughts
        - nextThoughtNeeded
        - branches
        - thoughtHistoryLength
        type: object
      sha256: sha256:57cbcf16eca1a5f1d4942f89146cb5216a664afb769e9e670f2362bfc40de84b
      title: Sequential Thinking
version: 1
