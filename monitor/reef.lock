    hub_repo_details:
      annotations:
        destructiveHint: false
        idempotentHint: false
        openWorldHint: true
        readOnlyHint: true
        title: Hub Repository Details
      description: 'Get details for one or more Hugging Face repos (model, dataset, or space): card metadata,
        license, downloads, files, Space hardware/status, dataset configs, splits, columns and preview
        rows. Auto-detects type unless specified. For datasets, use operations: overview, dataset_structure,
        dataset_preview. Use dataset_structure first to discover configs, splits, sizes, and schema. Use
        dataset_preview only when config and split are known, unless the dataset has a single config/split.'
      inputSchema:
        $schema: https://json-schema.org/draft/2020-12/schema
        properties:
          config:
            description: Dataset Viewer config. Required for dataset_preview when the dataset has multiple
              config/split options. Discover via dataset_structure.
            type: string
          limit:
            description: Row count for dataset_preview. Defaults to 5 and is clamped to 1-100.
            maximum: 9007199254740991
            minimum: -9007199254740991
            type: integer
          offset:
            description: Row offset for dataset_preview. Defaults to 0.
            maximum: 9007199254740991
            minimum: 0
            type: integer
          operations:
            description: Details to return. Defaults to ["overview"]. For datasets, prefer ["overview",
              "dataset_structure"] first; then call ["dataset_preview"] with config and split.
            items:
              enum:
              - overview
              - dataset_structure
              - dataset_preview
              type: string
            type: array
          repo_ids:
            description: Repo IDs for (models|dataset/space) - usually in author/name format (e.g. openai/gpt-oss-120b)
            items:
              minLength: 1
              type: string
            maxItems: 10
            minItems: 1
            type: array
          repo_type:
            description: Specify lookup type; otherwise auto-detects
            enum:
            - model
            - dataset
            - space
            type: string
          split:
            description: Dataset Viewer split. Required for dataset_preview when the dataset has multiple
              config/split options. Discover via dataset_structure.
            type: string
        required:
        - repo_ids
        type: object
      sha256: sha256:357a1e3eb848c75eed784dc9887cb4404bc5833e1e7ee4cb2c14633d1e573c27
      title: Hub Repository Details
    hub_repo_search:
      annotations:
        destructiveHint: false
        idempotentHint: false
        openWorldHint: true
        readOnlyHint: true
        title: Repo Search
      description: Search and list Hugging Face models, datasets and Spaces (sort by downloads, likes,
        trending) with a shared query interface. You can target models, datasets, spaces, or aggregate
        across multiple repo types in one call. Include links to repositories in your response.
      inputSchema:
        $schema: https://json-schema.org/draft/2020-12/schema
        properties:
          author:
            description: Organization or user namespace to filter by (e.g. 'google', 'meta-llama', 'huggingface').
            type: string
          filters:
            description: Optional hub filter tags. Applied to each selected repo type (e.g. ["text-generation"],
              ["language:en"], ["mcp-server"]).
            items:
              type: string
            type: array
          limit:
            default: 20
            description: Maximum number of results to return per selected repo type
            maximum: 100
            minimum: 1
            type: number
          query:
            description: Search term. Leave blank and specify sort + limit to browse trending or recent
              repositories.
            type: string
          repo_types:
            default:
            - model
            - dataset
            description: Repository types to search. Defaults to ["model", "dataset"]. space uses keyword
              search via /api/spaces.
            items:
              enum:
              - model
              - dataset
              - space
              type: string
            maxItems: 3
            minItems: 1
            type: array
          sort:
            description: 'Sort order (descending): trendingScore, downloads, likes, createdAt, lastModified'
            enum:
            - trendingScore
            - downloads
            - likes
            - createdAt
            - lastModified
            type: string
        type: object
      sha256: sha256:9b187727b371c7f80502892d14e8f797603ed930bed1d57b2b755fb5ddfb865f
      title: Repo Search
