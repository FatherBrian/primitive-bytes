  huggingface:
    hf_fs:
      annotations:
        destructiveHint: false
        idempotentHint: false
        openWorldHint: true
        readOnlyHint: true
        title: 'Hugging Face Hub: Find, use and view models, datasets, spaces, buckets, papers, documentation
          and collections. Get daily papers reports, and browse trending content. '
      description: "When to use: Hugging Face Hub models, datasets, Spaces, collections, papers, daily\
        \ papers, today's trending models, current paper leaderboard, docs; list and read repository files,\
        \ model and dataset cards (README, license).\n\nExamples:\n  {\"operations\":[{\"cmd\":\"ls\"\
        ,\"args\":[\"hf://models/trending\",\"--limit\",\"10\"]}]}\n  {\"operations\":[{\"cmd\":\"ls\"\
        ,\"args\":[\"hf://papers/trending\"]}]}\n  {\"operations\":[{\"cmd\":\"ls\",\"args\":[\"hf://papers/daily/latest\"\
        ]}]}\n  {\"operations\":[{\"cmd\":\"cat\",\"args\":[\"hf://papers/2501.00001/paper.md\"]}]}\n\
        \  {\"operations\":[{\"cmd\":\"search\",\"args\":[\"hf://models\",\"--tag\",\"base_model:finetune:org/repo\"\
        ]}]}\n\nUse hf_fs for Hugging Face Hub filesystem operations. Call it with operations, an array\
        \ of {cmd, args} items; multiple operations may be submitted together.\n\nUsage:\n  {\"operations\"\
        :[{\"cmd\":\"ls\",\"args\":[\"hf://models/org/repo\"]}]}\n\nGrammar; each string below is one\
        \ args array item:\n  ls     URI [--recursive] [--glob GLOB] [--type TYPE] [--sort SORT] [--limit\
        \ N]\n  cat    URI [--offset N] [--max-bytes N]\n  attach URI [--max-bytes N]\n  stat   URI\n\
        \  find   URI [--name GLOB] [--path GLOB] [--type TYPE] [--limit N]\n  search URI [QUERY] [--type\
        \ TYPE] [--sort SORT] [--tag TAG] [--kind mcp] [--limit N]\n\nCOMMAND = ls|cat|attach|stat|find|search.\n\
        TYPE = file|dir|repo|bucket|collection|paper|link.\nSORT = createdAt|downloads|likes|lastModified|likes30d|trendingScore|mainSize|id|trending|upvotes.\n\
        URI is a canonical hf:// URI. QUERY and GLOB are each one string.\n\nUse search for resource discovery,\
        \ not repository-content search; ls for a known directory, find for recursive file discovery by\
        \ name/path (not file contents), stat for filesystem metadata or an uncertain target type, cat\
        \ for text contents, and attach for a complete JPEG, PNG, or WebP image. When the request gives\
        \ an exact text-file URI, use cat directly; do not add ls or stat first. stat does not read the\
        \ contents of JSON, Markdown, or other text files.\n\nSearch scopes: hf://models[/OWNER], hf://datasets[/OWNER],\
        \ hf://spaces[/OWNER], hf://collections[/OWNER], hf://papers, and hf://docs[/...]. Repository\
        \ and repository-file scopes are not supported: search a resource root or owner scope to discover\
        \ resources; use find for file discovery within a repository or cat for a known text file. Paper\
        \ and documentation search require QUERY. --tag filters models, datasets, and Spaces by Hub tag\
        \ (repeatable; all must match) and applies only to hf://models|datasets|spaces[/OWNER]; omit QUERY\
        \ when the tag already identifies the target, because QUERY also filters repository names. Derived\
        \ models carry base_model:ID and base_model:RELATION:ID tags, where RELATION is finetune, adapter,\
        \ merge, or quantized. --kind applies only to hf://spaces[/OWNER]; the only valid --kind value\
        \ is mcp, which selects MCP Spaces. Tag families are documented at hf://README.md.\nUse ls hf://models/trending,\
        \ hf://datasets/trending, hf://spaces/trending, or hf://papers/trending for trending listings.\n\
        hf://papers/ID is a paper directory, not paper text. Use cat hf://papers/ID/paper.md for paper\
        \ text and cat hf://papers/ID/metadata.json for metadata. No preliminary listing is needed for\
        \ these known paths. Use ls hf://papers/ID to discover other resources.\nOmit --limit, --sort,\
        \ and --type unless the request requires them. Limits and path-specific behavior are documented\
        \ at hf://README.md. Issue one hf_fs call.\n\nLinks: hf://models|datasets|spaces/OWNER/NAME/PATH\
        \ maps to https://huggingface.co[/datasets|/spaces]/OWNER/NAME/resolve/main/PATH (buckets: https://huggingface.co/buckets/OWNER/NAME/resolve/PATH);\
        \ URL-encode each path segment. arXiv ids (for example 2502.16161) link papers, models and datasets."
      inputSchema:
        $schema: https://json-schema.org/draft/2020-12/schema
        additionalProperties: false
        properties:
          operations:
            items:
              additionalProperties: false
              properties:
                args:
                  description: Command arguments. First item must be an hf:// URI, not a local path or
                    bare filename. One argument per array item. search discovers resources, not repository
                    contents; use root/owner discovery scopes, find for file discovery, or cat for a known
                    text file. --tag requires hf://models|datasets|spaces[/OWNER]; --kind requires hf://spaces[/OWNER]
                    and its only valid value is mcp.
                  items:
                    type: string
                  type: array
                cmd:
                  description: Command to execute.
                  enum:
                  - ls
                  - cat
                  - attach
                  - stat
                  - find
                  - search
                  type: string
              required:
              - cmd
              - args
              type: object
            maxItems: 30
            minItems: 1
            type: array
        required:
        - operations
        type: object
      outputSchema:
        $schema: https://json-schema.org/draft/2020-12/schema
        additionalProperties: false
        properties:
          results:
            items:
              oneOf:
              - additionalProperties: false
                properties:
                  index:
                    maximum: 9007199254740991
                    minimum: 0
                    type: integer
                  output_truncated:
                    type: boolean
                  result:
                    additionalProperties: false
                    allOf:
                    - if:
                        properties:
                          op:
                            const: attach
                        required:
                        - op
                      then:
                        properties:
                          bytes:
                            maximum: 8388608
                            minimum: 0
                            type: integer
                          mime_type:
                            enum:
                            - image/jpeg
                            - image/png
                            - image/webp
                            type: string
                          path:
                            type: string
                        required:
                        - path
                        - mime_type
                        - bytes
                    properties:
                      arxiv_url:
                        type: string
                      bytes:
                        type: number
                      content:
                        type: string
                      content_type:
                        enum:
                        - application/json
                        - text/markdown
                        type: string
                      daily_papers_date:
                        type: string
                      daily_papers_uri:
                        type: string
                      entries:
                        items:
                          additionalProperties: false
                          properties:
                            anchor:
                              type: string
                            arxiv_url:
                              type: string
                            category:
                              type: string
                            content_type:
                              enum:
                              - application/json
                              - text/markdown
                              type: string
                            created_at:
                              type: string
                            daily_papers_date:
                              type: string
                            daily_papers_uri:
                              type: string
                            description:
                              type: string
                            downloads:
                              type: number
                            gated:
                              anyOf:
                              - const: false
                                type: boolean
                              - enum:
                                - auto
                                - manual
                                type: string
                            lfs:
                              type: boolean
                            library:
                              type: string
                            likes:
                              type: number
                            name:
                              type: string
                            observed_at:
                              type: string
                            path:
                              type: string
                            private:
                              type: boolean
