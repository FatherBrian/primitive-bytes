      sha256: sha256:298ecd13c4613d8348a871bea4ed7a9c36f32471ba05c5ccf2a8c4d45ee02f46
    search_cloudflare_documentation:
      annotations:
        readOnlyHint: true
        title: Search Cloudflare docs
      description: "Search the Cloudflare documentation.\n\n\t\tThis tool should be used to answer any\
        \ question about Cloudflare products or features, including:\n\t\t- Workers, Pages, R2, Images,\
        \ Stream, D1, Durable Objects, KV, Workflows, Hyperdrive, Queues\n\t\t- AI Search, Workers AI,\
        \ Vectorize, AI Gateway, Browser Run\n\t\t- Zero Trust, Access, Tunnel, Gateway, Browser Isolation,\
        \ WARP, DDOS, Magic Transit, Magic WAN\n\t\t- CDN, Cache, DNS, Zaraz, Argo, Rulesets, Terraform,\
        \ Account and Billing\n\n\t\tResults are returned as semantically similar chunks to the query.\n\
        \t\t"
      inputSchema:
