# reef.lock: what each tool said when it was reviewed. Written by `reef lock`.
# Reef hides and refuses a tool that no longer matches. Review changes like code.
servers:
  aws-knowledge:
    aws___get_regional_availability:
      annotations:
        destructiveHint: false
        openWorldHint: false
        readOnlyHint: true
      description: 'AWS resource availability per region.


        - Max 10 regions; multi-region needs `filters`; single-region supports `next_token`.

        - Status: isAvailableIn | isNotAvailableIn | isPlannedIn | Not Found.

        - Response key: products | service_apis | cfn_resources.


        Not for region counts/docs/vague queries -- use `search_documentation` / `list_regions`.


        Filter values must EXACTLY match AWS''s catalog names; guessed, partial, or pluralized names are
        rejected ("values in filter parameter do not exist"). If unsure of the exact name, first call
        once for a single region with resource_type set and NO filters to list all valid names, then re-call
        filtering on the exact match.'
      inputSchema:
        properties:
          filters:
            description: 'Use exact AWS product or sub-feature name.


              - product: ''Amazon Bedrock'' (service), or sub-features like ''Comprehend Auto Scaling'',
              ''Latency-Based Routing'', ''PrivateLink Support''. When the user names a specific sub-feature,
              filter on the sub-feature -- do NOT generalize to the parent service (''Amazon Comprehend'');
              that returns availability for the wrong scope.

              - api: ''SdkServiceId+Operation'' (e.g. ''CloudFormation+CreateStack'', ''IAM+GetSSHPublicKey'')
              or ''SdkServiceId'' (e.g. ''EC2''). Use a literal ''+'' between service and operation --
              not space, colon, or hyphen.

              - cfn: ''AWS::EC2::Instance'', ''AWS::Lambda::Function''.


              Include every region the user named; don''t add filters they didn''t request.


              Values must EXACTLY match AWS''s catalog (e.g. ''AWS Lambda'', not ''Lambda'' or ''AWS Lambda
              Service''). If unsure of the exact name, first call once for one region with NO filters
              to list valid names, then filter on the exact match.'
            items:
              type: string
            type: array
          next_token:
            description: Pagination token. Single-region, no filters only.
            type: string
          region:
            description: Unused; use `regions`.
            type: string
          regions:
            description: AWS region codes (max 10). Multi-region requires `filters`; single-region supports
              `next_token`.
            items:
              type: string
            type: array
          resource_type:
            description: 'Required: ''product'' | ''api'' | ''cfn''.'
            type: string
        required:
        - resource_type
        type: object
      sha256: sha256:67e402c403bfd8a3f0519c17e849bffe0d6e8107e5ca1c5a572a117d46ecedf7
    aws___list_regions:
      annotations:
        destructiveHint: false
        openWorldHint: false
        readOnlyHint: true
      description: Retrieve a list of all AWS regions.
      inputSchema:
        properties: {}
        required: []
        type: object
      sha256: sha256:aafb08ae1a85a49fbef7bd0e2c025bdde8d41be2f29719995b3b647692fad830
    aws___read_documentation:
      annotations:
        destructiveHint: false
        openWorldHint: false
        readOnlyHint: true
      description: 'Fetch full AWS doc pages as markdown. `search_documentation` already returns verbatim
        page chunks, so don''t re-read a URL whose chunk you already have to "confirm" or "round out"
        an answer -- the chunk is the real page text; treat it as authoritative.


        Reading the full page is justified ONLY when the chunks genuinely lack the content:

        - an enumeration or aggregation ("list all X", "how many X") needs the complete set and the chunks
        show only part of it;

        - no search result is on-topic after refining the query, and a known doc URL would have the answer.

        Otherwise, answer from the chunks. Use exact URLs from `search_documentation`; don''t guess slugs.


        Input: `requests: [{url, max_length?, start_index?}]`. Batch 2-5.

        - `max_length` default 10000.

        - `start_index` default 0; use prior `end_index` to continue, TOC offset to jump.


        Allow-listed prefixes: docs.aws.amazon.com; aws.amazon.com (not /marketplace); repost.aws/knowledge-center;
        docs.amplify.aws; ui.docs.amplify.aws; github.com/{aws-cloudformation/aws-cloudformation-templates,
        aws-samples/{aws-cdk-examples, generative-ai-cdk-constructs-samples, serverless-patterns}, awsdocs/aws-cdk-guide,
        awslabs/aws-solutions-constructs, cdklabs/cdk-nag} (README on `main`); constructs.dev/packages/{@aws-cdk-containers,
        @aws-cdk, @cdk-cloudformation, aws-analytics-reference-architecture, aws-cdk-lib, cdk-amazon-chime-resources,
        cdk-aws-lambda-powertools-layer, cdk-ecr-deployment, cdk-lambda-powertools-python-layer, cdk-serverless-clamscan,
        cdk8s, cdk8s-plus-33}; strandsagents.com/latest/documentation/docs/; karpenter.sh/docs/; Amazon
        Braket: {amazon-braket-sdk-python, amazon-braket-schemas-python, amazon-braket-default-simulator-python,
        amazon-braket-pennylane-plugin-python, amazon-braket-algorithm-library, qiskit-braket-provider,
        autoqasm, qirtoqasm}.readthedocs.io and github.com/amazon-braket/* (blob/tree/raw).


        Output: SUCCESS -- markdown + `total_length, start_index, end_index, truncated, redirected_url?`
        (truncated includes TOC with char ranges). ERROR -- `error_code` in {not_found, invalid_url, throttled,
        downstream_error, validation_error}.'
      inputSchema:
        properties:
          requests:
            description: List of `{url, max_length?, start_index?}`. Batch 2-5.
            items:
              properties:
                max_length:
                  description: Chars returned (default 10000).
                  type: integer
                start_index:
                  description: Char offset (default 0). Use prior `end_index` to continue, or TOC offset
                    to jump.
                  type: integer
                url:
                  description: Doc URL with allow-listed prefix; use exact URL from search.
                  type: string
              required:
              - url
              type: object
            type: array
        required: []
        type: object
      sha256: sha256:69d59e7747d11e3e6cc088fa0069d858a6b2754e531d50376905bf7a8295a89f
    aws___retrieve_skill:
      annotations:
        destructiveHint: false
        openWorldHint: false
        readOnlyHint: true
      description: 'Retrieve an AWS skill (workflows, references). Returns SKILL.md, or `file` if given.


        Call `search_documentation` FIRST and copy `skill_name` verbatim -- it is an opaque registry ID.
        Never guess or fabricate `skill_name` or `file`.'
      inputSchema:
        properties:
          file:
            description: Optional file path within the skill, copied as cited (e.g. `references/architecture.md`).
              Don't add or strip a `references/` prefix. Omit for SKILL.md.
            type: string
          skill_name:
            description: Required. Exact `skill_name` from a search_documentation result, copied verbatim.
              Do not invent or modify.
            type: string
        required:
        - skill_name
        type: object
      sha256: sha256:a1c850a998ea4713615daf4b35daee7483d6e5764bd8509930c3aef25e05bb54
    aws___search_documentation:
      annotations:
        destructiveHint: false
        openWorldHint: false
        readOnlyHint: true
      description: 'AWS docs search. Each result''s `context` is verbatim page text -- a real chunk of
        the actual page, not a short snippet -- and usually already contains the answer, so answer directly
        from it. Use `read_documentation` only when the chunks genuinely lack the needed detail.


        Pick ONE topic. Add a 2nd ONLY if query genuinely spans domains. Extra topics dilute ranking.


        - reference_documentation -- API/SDK/CLI specs, config params

        - current_awareness -- new/released/announced

        - troubleshooting -- errors, "how to fix" (NOT for conceptual/feature questions)

        - amplify_docs -- Amplify (+ language)

        - cdk_docs -- CDK concepts/guides

        - cdk_constructs -- CDK code samples, L3

        - cloudformation -- CFN/SAM templates

        - strands_docs -- Strands Agents SDK (its Skills/agents concepts go here, NOT agent_skills)

        - agent_skills -- this tool''s guided skills (load via `retrieve_skill`)

        - general (default) -- architecture, best practices, tutorials, feature behavior


        Results: rank_order (lower=better), url, title, context (verbatim page chunk -- answer directly
        from it).'
      inputSchema:
        properties:
          limit:
            description: Maximum number of results to return (default 4).
            type: integer
          search_phrase:
            description: Keywords; preserve exact error strings and all task terms verbatim.
            type: string
          topics:
            description: 'Up to 3 from: reference_documentation, current_awareness, troubleshooting, amplify_docs,
              cdk_docs, cdk_constructs, cloudformation, agent_skills, strands_docs, general. Default ["general"].'
            items:
              description: topic name
              type: string
            type: array
        required:
        - search_phrase
        type: object
      sha256: sha256:246ec034674e0477e567249452bbbd0e1cf48410c0cfa20f0ba58247d6be09dd
  cloudflare-docs:
    migrate_pages_to_workers_guide:
      annotations:
        readOnlyHint: true
        title: Get Pages migration guide
      description: ALWAYS read this guide before migrating Pages projects to Workers.
      inputSchema:
        $schema: https://json-schema.org/draft/2020-12/schema
