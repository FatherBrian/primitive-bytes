        $schema: https://json-schema.org/draft/2020-12/schema
        additionalProperties: false
        properties:
          code:
            description: 'A JavaScript function containing Playwright code to execute. It will be invoked
              with a single argument, page, which you can use for any page interaction. For example: `async
              (page) => { await page.getByRole(''button'', { name: ''Submit'' }).click(); return await
              page.title(); }`'
            type: string
          filename:
            description: Load code from the specified file. Relative file names are resolved against the
              workspace root. If both code and filename are provided, code will be ignored.
            type: string
        type: object
      sha256: sha256:f25ce84a6fe90b09f04b1f9cf2d4958c298abb1f1c9dff68a8eea60c7a9379de
    browser_select_option:
