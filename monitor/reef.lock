    browser_snapshot:
      annotations:
        destructiveHint: false
        openWorldHint: true
        readOnlyHint: true
        title: Page snapshot
      description: Capture accessibility snapshot of the current page, this is better than screenshot
      inputSchema:
        $schema: https://json-schema.org/draft/2020-12/schema
        additionalProperties: false
        properties:
          boxes:
            description: Include each element's bounding box as [box=x,y,width,height] in the snapshot.
              Coordinates are viewport-relative, in CSS pixels (Element.getBoundingClientRect)
            type: boolean
          depth:
            description: Limit the depth of the snapshot tree
            type: number
          filename:
            description: Save snapshot to a file instead of returning it in the response. Relative file
              names are resolved against the workspace root.
            type: string
          target:
            description: Exact target element reference from the page snapshot, or a unique element selector
            type: string
        type: object
      sha256: sha256:a80fc3ad01eda5a14610259ab722458a212054d1d236adfe7f4a0403ef69ac33
    browser_tabs:
      annotations:
        destructiveHint: true
        openWorldHint: true
        readOnlyHint: false
        title: Manage tabs
      description: List, create, close, or select a browser tab.
      inputSchema:
        $schema: https://json-schema.org/draft/2020-12/schema
        additionalProperties: false
        properties:
          action:
            description: Operation to perform
            enum:
            - list
            - new
            - close
            - select
            type: string
          index:
            description: Tab index, used for close/select. If omitted for close, current tab is closed.
            type: number
          isolatedContext:
            description: Name of an isolated browser context to create the new tab in, used for new. Tabs
              in the same isolated context share cookies and storage, tabs in different contexts are fully
              isolated. If omitted or "default", the tab is created in the default context.
            type: string
          url:
            description: URL to navigate to in the new tab, used for new.
            type: string
        required:
        - action
        type: object
      sha256: sha256:b36d917ac265604f932d3aa144ba5040c196669db7dc1e44528e8fb1edcb4c7c
    browser_take_screenshot:
      annotations:
        destructiveHint: false
        openWorldHint: true
        readOnlyHint: true
        title: Take a screenshot
      description: Take a screenshot of the current page. Use browser_snapshot for actions by default.
        With the vision capability enabled, use screenshot coordinates with the coordinate-based mouse
        tools for elements not exposed in the accessibility snapshot.
      inputSchema:
        $schema: https://json-schema.org/draft/2020-12/schema
        additionalProperties: false
        properties:
          element:
            description: Human-readable element description used to obtain permission to interact with
              the element
            type: string
          filename:
            description: File name to save the screenshot to. Relative file names are resolved against
              the workspace root. If not specified, the screenshot is saved into the output directory
              as `page-{timestamp}.{png|jpeg|webp}`.
            type: string
          fullPage:
            description: When true, takes a screenshot of the full scrollable page, instead of the currently
              visible viewport. Cannot be used with element screenshots.
            type: boolean
          scale:
            default: css
            description: Image resolution scale. "css" produces a screenshot sized in CSS pixels (smaller,
              consistent across devices). "device" produces a high-resolution screenshot using device
              pixels (larger, accounts for the device pixel ratio). Default is css.
            enum:
            - css
            - device
            type: string
          target:
            description: Exact target element reference from the page snapshot, or a unique element selector
            type: string
          type:
            description: Image format for the screenshot. If unset, inferred from the filename extension,
              otherwise png.
            enum:
            - png
            - jpeg
            - webp
            type: string
        required:
        - scale
        type: object
      sha256: sha256:56f68d37e9bc396f873d265ee66ac3fc11fda8772bc645bf80154a3aec5518fb
    browser_type:
