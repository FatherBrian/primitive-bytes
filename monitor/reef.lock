            type: boolean
          submit:
            description: Whether to submit entered text (press Enter after)
            type: boolean
          target:
            description: Exact target element reference from the page snapshot, or a unique element selector
            type: string
          text:
            description: Text to type into the element
            type: string
        required:
        - target
        - text
        type: object
      sha256: sha256:ccdeed9e421307b5df7b1bafa3a069ee673217c06996796de1154bd52989636d
    browser_wait_for:
      annotations:
        destructiveHint: false
        openWorldHint: true
        readOnlyHint: true
        title: Wait for
      description: Wait for text to appear or disappear or a specified time to pass. When both text and
